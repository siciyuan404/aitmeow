<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <clipPath id="rounded-square">
      <rect width="400" height="400" rx="80" ry="80"/>
    </clipPath>
  </defs>

  <!-- 圆角方形背景 -->
  <rect width="400" height="400" rx="80" ry="80" fill="#000000"/>

  <g clip-path="url(#rounded-square)">
    <!-- 像素网格大小 35x35，每个方块带描边 -->
    <g fill="#FFFFFF" stroke="#000000" stroke-width="2">
      <!-- I 字母 - 左上 -->
      <rect x="70" y="70" width="35" height="35"/>
      <rect x="105" y="70" width="35" height="35"/>
      <rect x="140" y="70" width="35" height="35"/>
      <rect x="105" y="105" width="35" height="35"/>
      <rect x="105" y="140" width="35" height="35"/>
      <rect x="70" y="175" width="35" height="35"/>
      <rect x="105" y="175" width="35" height="35"/>
      <rect x="140" y="175" width="35" height="35"/>

      <!-- S 字母 - 右上 -->
      <rect x="227.5" y="70" width="35" height="35"/>
      <rect x="262.5" y="70" width="35" height="35"/>
      <rect x="297.5" y="70" width="35" height="35"/>
      <rect x="227.5" y="105" width="35" height="35"/>
      <rect x="227.5" y="140" width="35" height="35"/>
      <rect x="262.5" y="140" width="35" height="35"/>
      <rect x="297.5" y="140" width="35" height="35"/>
      <rect x="297.5" y="175" width="35" height="35"/>
      <rect x="227.5" y="210" width="35" height="35"/>
      <rect x="262.5" y="210" width="35" height="35"/>
      <rect x="297.5" y="210" width="35" height="35"/>

      <!-- V 字母 - 左下 -->
      <rect x="70" y="227.5" width="35" height="35"/>
      <rect x="70" y="262.5" width="35" height="35"/>
      <rect x="70" y="297.5" width="35" height="35"/>
      <rect x="105" y="332.5" width="35" height="35"/>

      <rect x="175" y="227.5" width="35" height="35"/>
      <rect x="175" y="262.5" width="35" height="35"/>
      <rect x="175" y="297.5" width="35" height="35"/>
      <rect x="140" y="332.5" width="35" height="35"/>

      <!-- G 字母 - 右下 -->
      <rect x="227.5" y="227.5" width="35" height="35"/>
      <rect x="262.5" y="227.5" width="35" height="35"/>
      <rect x="297.5" y="227.5" width="35" height="35"/>
      <rect x="227.5" y="262.5" width="35" height="35"/>
      <rect x="227.5" y="297.5" width="35" height="35"/>
      <rect x="262.5" y="297.5" width="35" height="35"/>
      <rect x="297.5" y="297.5" width="35" height="35"/>
      <rect x="297.5" y="332.5" width="35" height="35"/>
      <rect x="227.5" y="332.5" width="35" height="35"/>
      <rect x="262.5" y="332.5" width="35" height="35"/>
    </g>
  </g>
</svg>
