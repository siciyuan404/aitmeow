[package]
name = "aitmeow-server"
version = "0.1.0"
edition = "2021"

[dependencies]
aitmeow-core = { path = "../aitmeow-core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
rmcp = { version = "0.3", features = ["transport-streaming"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[[bin]]
name = "aitmeow-server"
path = "src/main.rs"
