[package]
name = "aitmeow-core"
version = "0.1.0"
edition = "2021"

[dependencies]
usvg = "0.44"
resvg = "0.44"
tiny-skia = "0.11"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
svgtypes = "0.15"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
tokio = { version = "1", features = ["full"] }
regex = "1"
once_cell = "1"

[lib]
name = "aitmeow_core"
path = "src/lib.rs"
