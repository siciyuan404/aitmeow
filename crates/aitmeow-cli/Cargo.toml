[package]
name = "aitmeow-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
aitmeow-core = { path = "../aitmeow-core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tracing-subscriber = "0.3"
tracing = "0.1"

[[bin]]
name = "aitmeow"
path = "src/main.rs"
