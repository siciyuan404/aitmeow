name: Desktop Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-desktop:
    name: Windows desktop package
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build bundled server
        run: cargo build -p aitmeow-server --release

      - name: Verify server binary
        run: |
          if (!(Test-Path -LiteralPath "target/release/aitmeow-server.exe")) {
            throw "target/release/aitmeow-server.exe was not built"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "v$version"
          if ($expected -ne "${{ github.ref_name }}") {
            throw "Release tag ${{ github.ref_name }} does not match desktop version $expected"
          }

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop renderer
        working-directory: desktop
        run: npm run build

      - name: Build Electron main process
        working-directory: desktop
        run: npm run build:electron

      - name: Package Windows desktop app
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never

      - name: Verify desktop package
        run: |
          $installer = Get-ChildItem "release" -Filter "AitMeow-Setup-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$installer) {
            throw "NSIS installer not found in release/"
          }
          Write-Host "Found installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 1)) MB)"

          if (!(Test-Path -LiteralPath "release/latest.yml")) {
            throw "Missing latest.yml update manifest"
          }

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: AitMeow-win32-x64
          path: |
            release/AitMeow-Setup-*.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = (Get-ChildItem "release" -Filter "AitMeow-Setup-*.exe" | Select-Object -First 1).FullName

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "AitMeow $tag" --generate-notes
          }

          gh release upload $tag $installer "release/latest.yml" --repo $env:GITHUB_REPOSITORY --clobber
